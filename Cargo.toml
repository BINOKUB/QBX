[package]
name = "qbx"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.5"

[dependencies.lazy_static]
version = "1.4.0"
features = ["spin_no_std"]

[dependencies.x86_64]
version = "0.14.10"
default-features = false
features = ["instructions", "abi_x86_interrupt"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
